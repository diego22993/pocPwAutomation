name: Playwright Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: dev   # <- clave: sin esto, GitHub ignora los Environment secrets de "dev"
                        #    y usa solo los Repository secrets (los del scope de arriba)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # --- Step temporal de diagnóstico ---
      # No imprime valores, solo confirma si las env vars llegaron seteadas.
      # Sacalo una vez que confirmes que el problema estaba resuelto.
      - name: Debug env vars (sin exponer valores)
        env:
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          echo "TEST_USER está seteado: $([ -n "$TEST_USER" ] && echo SI || echo NO)"
          echo "TEST_PASS está seteado: $([ -n "$TEST_PASS" ] && echo SI || echo NO)"
          echo "BASE_URL está seteado: $([ -n "$BASE_URL" ] && echo SI || echo NO)"

      - name: Run Playwright tests
        env:
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30